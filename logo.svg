  <!-- Feed lines -->
  <line x1="160" y1="310" x2="352" y2="310" stroke="#ff6b35" stroke-width="6" stroke-linecap="round"/>
  <line x1="170" y1="340" x2="340" y2="340" stroke="#e0e0e0" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
