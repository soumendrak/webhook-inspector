  <rect x="195" y="110" width="24" height="90" rx="6" fill="#e0e0e0" opacity="0.4"/>
  <rect x="235" y="140" width="24" height="120" rx="6" fill="#ff6b35" opacity="0.7"/>
  <rect x="275" y="110" width="24" height="90" rx="6" fill="#e0e0e0" opacity="0.4"/>
